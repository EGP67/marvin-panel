<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="glow" cx="50%" cy="14%" r="78%">
      <stop offset="0%" stop-color="#0d2331"/><stop offset="100%" stop-color="#04070b"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".055"/>
      <stop offset="26%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1c6f83"/><stop offset="100%" stop-color="#5fd8ef"/>
    </linearGradient>

    <!-- CPU CORE DOT MATRIX -
         One global 11px dot lattice, phase-locked so every core box gets whole
         dots and no clipped edges. Constraints you must preserve if you resize:
           horizontal core pitch (154) % 11 == 0
           vertical row pitch (672-584=88) % 11 == 0
           fill heights snap to multiples of 11 (5 rows = 0,20,40,60,80,100%)
    - -->
    <pattern id="dots" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="translate(5,3)">
      <circle cx="7" cy="7" r="3.2" fill="#ffffff"/>
    </pattern>
    <pattern id="dotsDim" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="translate(5,3)">
      <circle cx="7" cy="7" r="3.2" fill="#15323d"/>
    </pattern>
    <mask id="dotMask">
      <rect x="88" y="584" width="904" height="152" fill="url(#dots)"/>
    </mask>

    <style>
      text{font-family:ui-monospace,"DejaVu Sans Mono",monospace}
      text:not([fill]){fill:#9fd4e3}
      .lbl{font-size:23px;letter-spacing:3px}
      .lbl:not([fill]){fill:#4d7f8f}
      .val{font-size:28px}
      .val:not([fill]){fill:#cdeef7}
      .dim{font-size:24px}
      .dim:not([fill]){fill:#6b9dad}
      .sm{font-size:19px;letter-spacing:1px}
      .sm:not([fill]){fill:#5d8b9a}
      .hi{font-size:132px;font-weight:600}
      .quip{font-size:30px;font-style:italic}
      .quip:not([fill]){fill:#f0b429}
      .gpu{font-size:104px;font-weight:600}
      .gpu:not([fill]){fill:#5fd8ef}
      .fah{font-size:42px}
      .fah:not([fill]){fill:#cdeef7}
      .cel{font-size:25px}
      .cel:not([fill]){fill:#6b9dad}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- TITLE -->
  <text x="540" y="126" text-anchor="middle" font-size="78" letter-spacing="14" fill="#5fd8ef">HEART OF GOLD</text>
  <line x1="64" y1="170" x2="1016" y2="170" stroke="#1d4a5a" stroke-width="2"/>

  <!-- PHRASE -->
  <rect x="64" y="190" width="952" height="128" rx="14" fill="#0c1620" stroke="#3a2f14"/>
  <text x="540" y="240" text-anchor="middle" class="quip">THE HEART OF GOLD HAS THE WORST PROBABILITY</text>
  <text x="540" y="280" text-anchor="middle" class="quip">COEFFICIENT IN THE GALAXY. MY TEMP IS SECOND.</text>
  <text x="984" y="310" text-anchor="end" font-size="19" letter-spacing="3" fill="#6b7f5a">— MARVIN, ON BOARD SINCE LAUNCH</text>

  <!-- PROCESSOR -
       BIG NUMBER FILL = CPU TEMP BAND (swap this one attribute per tick):
         temp C <  60        -> #5fd8ef   (cyan, current)
         60 <= temp C < 90   -> #f0b429   (gold)
         temp C >= 90        -> #ff6a3d   (red)
       Shown here at 48C -> cyan.
    - -->
  <rect x="64" y="338" width="952" height="470" rx="14" fill="#08131c" stroke="#153a48"/>
  <text x="96" y="382" font-size="30" letter-spacing="3">PROCESSOR: <tspan fill="#4d7f8f">AMD RYZEN 5 9600X</tspan></text>
  <text x="992" y="386" text-anchor="end" class="sm">LAST 120 s</text>
  <text x="96" y="500" class="hi" fill="#5fd8ef">52<tspan font-size="56">%</tspan></text>
  <text x="96" y="548" class="val">4.9 GHZ | TEMP: 118°F / 48°C</text>

