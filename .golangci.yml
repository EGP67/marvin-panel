# golangci-lint v2 configuration.
# If `golangci-lint --version` reports 1.x, run `golangci-lint migrate` or delete the
# version/formatters keys — v2 changed the config schema.
version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - gocritic
    - revive
    - nilerr
    - noctx
    - bodyclose
    - contextcheck
    - unconvert
    - misspell
    - exhaustive
    - forbidigo
  settings:
    errcheck:
      check-blank: true
    revive:
      rules:
        - name: package-comments
          disabled: true
    forbidigo:
      forbid:
        - pattern: ^http\.(Get|Head|Post|PostForm)$
          msg: "D-013: no outbound HTTP outside internal/server"
        - pattern: ^http\.(Client|DefaultClient)$
          msg: "D-013: no outbound HTTP outside internal/server"
        - pattern: ^net\.(Dial|DialTimeout|Dialer)$
          msg: "D-013: no outbound network outside internal/server"
  exclusions:
    rules:
      - path: ^internal/server/
        linters:
          - forbidigo
formatters:
  enable:
    - gofmt
    - goimports
