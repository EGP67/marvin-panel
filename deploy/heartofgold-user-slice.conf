# D-053: limits and device policy for everything heartofgold runs (logind session scope,
# user manager, Brave app scopes). Installed as /etc/systemd/system/user-<uid>.slice.d/50-heartofgold.conf.
[Slice]
MemoryHigh=768M
MemoryMax=1G
CPUQuota=50%
DevicePolicy=closed
DeviceAllow=/dev/dri/by-path/pci-0000:11:00.0-card rw
DeviceAllow=/dev/dri/by-path/pci-0000:11:00.0-render rw
DeviceAllow=/dev/tty0 rw
DeviceAllow=/dev/tty1 rw
DeviceAllow=/dev/tty rw
DeviceAllow=/dev/ptmx rw
DeviceAllow=char-pts rw
