# HEART OF GOLD kiosk X config. Rotation "right" = mounted, cables south; "left" on the bench (D-045).
# Native mode 1024x600 (D-054); the kiosk session's xrandr call is the enforcing step, so Xorg
# may report PreferredMode as "not used".
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
EndSection
Section "Device"
    Identifier "iGPU"
    Driver "amdgpu"
    BusID "PCI:17:0:0"
    Option "Monitor-HDMI-A-0" "Panel"
EndSection
Section "Monitor"
    Identifier "Panel"
    Option "PreferredMode" "1024x600"
    Option "Rotate" "right"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "iGPU"
    Monitor "Panel"
EndSection
