# HEART OF GOLD kiosk X config. Rotation "right" = mounted, cables south; "left" on the bench (D-045).
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
EndSection
Section "Device"
    Identifier "iGPU"
    Driver "amdgpu"
    BusID "PCI:17:0:0"
    Option "Monitor-HDMI-A-0" "Panel"
EndSection
Section "Monitor"
    Identifier "Panel"
    Option "PreferredMode" "1920x1080"
    Option "Rotate" "right"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "iGPU"
    Monitor "Panel"
EndSection
